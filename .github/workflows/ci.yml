name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar analyzes the PR head, so coverage must come from that same revision.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, PostgreSQL integration tests and coverage
        run: ./mvnw -B clean verify
      - name: Build linux/amd64 application container
        run: docker buildx build --platform linux/amd64 --file Dockerfile --tag job-agent:ci --load .
      - name: Verify one-off bootstrap image and isolated PostgreSQL grants
        run: |
          docker buildx build --platform linux/amd64 --file infra/bootstrap/Dockerfile --tag job-agent-bootstrap:phase5b-local --load .
          bash infra/bootstrap/test-local.sh
      - name: Verify analysis inputs
        run: |
          test -s target/site/jacoco/jacoco.xml
          test -f target/classes/com/alexs/jobagent/JobAgentApplication.class
          test -f target/test-classes/com/alexs/jobagent/ModuleBoundaryTest.class
      - name: Upload Sonar analysis inputs
        uses: actions/upload-artifact@v4
        with:
          name: sonar-analysis-inputs
          path: |
            target/classes/
            target/test-classes/
            target/site/jacoco/jacoco.xml
          if-no-files-found: error
          retention-days: 1

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.17.1
      - name: Format
        run: terraform fmt -check -recursive infra/terraform
      - name: Initialize without backend
        working-directory: infra/terraform
        run: terraform init -backend=false -input=false
      - name: Validate without AWS credentials
        working-directory: infra/terraform
        run: terraform validate

  sonar:
    name: Sonar Quality Gate
    needs: build
    # Only owner-controlled, same-repository, human-authored PRs are trusted here.
    # Forks and bot-authored dependency PRs receive no Sonar credentials.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.type != 'Bot' &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Download tested classes and coverage
        uses: actions/download-artifact@v4
        with:
          name: sonar-analysis-inputs
          path: target
      - name: Verify tested revision and analysis inputs
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -s target/site/jacoco/jacoco.xml
          test -f target/classes/com/alexs/jobagent/JobAgentApplication.class
          test -f target/test-classes/com/alexs/jobagent/ModuleBoundaryTest.class
      - name: Analyze with SonarQube Cloud and wait for Quality Gate
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [[ -z "$SONAR_HOST_URL" || -z "$SONAR_ORGANIZATION" || -z "$SONAR_PROJECT_KEY" || -z "$SONAR_TOKEN" ]]; then
            echo '::error::Sonar analysis NOT CONFIGURED; set SONAR_HOST_URL, SONAR_ORGANIZATION, SONAR_PROJECT_KEY and secret SONAR_TOKEN.'
            exit 1
          fi
          scan_args=(
            "-Dsonar.host.url=$SONAR_HOST_URL"
            "-Dsonar.organization=$SONAR_ORGANIZATION"
            "-Dsonar.projectKey=$SONAR_PROJECT_KEY"
            "-Dsonar.qualitygate.wait=true"
            "-Dsonar.qualitygate.timeout=300"
          )
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            scan_args+=(
              "-Dsonar.pullrequest.key=$PR_NUMBER"
              "-Dsonar.pullrequest.branch=$PR_HEAD_REF"
              "-Dsonar.pullrequest.base=$PR_BASE_REF"
            )
          fi
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar "${scan_args[@]}"
