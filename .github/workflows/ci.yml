name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, PostgreSQL integration tests and coverage
        run: ./mvnw -B clean verify
      # Never provide SONAR_TOKEN to pull_request code. Analysis is enabled only
      # for main after repository variables and the secret have been configured.
      - name: Analyze with SonarQube Cloud when configured
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -z "$SONAR_HOST_URL" || -z "$SONAR_ORGANIZATION" || -z "$SONAR_PROJECT_KEY" || -z "$SONAR_TOKEN" ]]; then
            echo '::notice::Sonar analysis NOT CONFIGURED; set SONAR_HOST_URL, SONAR_ORGANIZATION, SONAR_PROJECT_KEY and secret SONAR_TOKEN.'
            exit 0
          fi
          test -s target/site/jacoco/jacoco.xml
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300
